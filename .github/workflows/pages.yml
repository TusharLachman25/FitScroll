name: Deploy PWA

# Publishes web/ to GitHub Pages, which is what the iPhone home-screen app
# loads from.
#
# GitHub Pages cannot serve a private repository on a Free plan, so the deploy
# job is gated on visibility: it skips silently while the repo is private and
# starts running by itself the moment it is made public. That avoids a red
# cross on every push in the meantime.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish to GitHub Pages
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v5

      - name: Verify the PWA core still passes its rules
        working-directory: web
        run: node --test

      # enablement turns Pages on via the API the first time this runs, so
      # making the repo public is the only step needed - no visit to the
      # repository settings.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - id: deployment
        uses: actions/deploy-pages@v4
